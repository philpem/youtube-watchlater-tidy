[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-watchlater-tidy"
version = "0.1.0"
description = "Tools for triaging and cleaning up a large YouTube Watch Later playlist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
watchlater = "youtube_watchlater_tidy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
