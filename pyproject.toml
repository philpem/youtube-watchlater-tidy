[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-watchlater-tidy"
version = "0.1.0"
description = "Tools for triaging and cleaning up a large YouTube Watch Later playlist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "tomli>=2; python_version < '3.11'",
    "tqdm>=4.66",
]

[project.scripts]
watchlater = "youtube_watchlater_tidy.cli:main"
watchlater-dearrow = "youtube_watchlater_tidy.dearrow_cli:main"
watchlater-llm = "youtube_watchlater_tidy.llm_cli:main"
watchlater-metadata = "youtube_watchlater_tidy.metadata_cli:main"
watchlater-transcript = "youtube_watchlater_tidy.transcript_cli:main"
watchlater-llm-transcript = "youtube_watchlater_tidy.llm_transcript_cli:main"
watchlater-review = "youtube_watchlater_tidy.review_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
